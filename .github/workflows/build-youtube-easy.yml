name: Build YouTube Easy v0.1.0

on:
  push:
    tags: ["youtube-easy-v*"]

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax and offline tests
        run: |
          set -euo pipefail
          npm --prefix youtube-easy run check
          npm --prefix youtube-easy test

      - name: Build deterministic artifacts
        run: npm --prefix youtube-easy run build

      - name: Verify tag and committed artifacts
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "youtube-easy-v0.1.0"
          git diff --exit-code -- \
            youtube-easy/youtube-easy-v0.1.0.mcpb \
            youtube-easy/youtube-easy-v0.1.0-source.zip \
            youtube-easy/youtube-easy-v0.1.0.mcpb.sha256

      - name: Verify packaged MCP server
        run: node --test youtube-easy/test/package.test.mjs

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          tag="youtube-easy-v0.1.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists. Refusing to overwrite immutable release assets." >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/youtube-easy-notes.md" <<'EOF'
          YouTube Easy v0.1.0 is a ready-to-import, dependency-free Node 22 MCPB for YouTube and YouTube Studio browser automation.

          Download → import → run `youtube_login` → sign in normally in Google/YouTube → run `youtube_status`.

          No YouTube Data API, Google Cloud/OAuth client setup, API keys, copied cookies, session tokens, `.env` credentials, or runtime npm install is used. Writes use cross-process leases, persisted duplicate protection, crash reconciliation, and fail-closed pre-commit verification.

          This release passed the offline browser-detection, URL validation, simulated Studio DOM, independent-process race, stale-lock, result-reuse, uncertain-reconciliation, MCP smoke, and package tests. No real Google login or live YouTube upload was performed for v0.1.0. YouTube can change its web UI or anti-automation behavior without notice.
          EOF
          assets=(
            youtube-easy/youtube-easy-v0.1.0.mcpb
            youtube-easy/youtube-easy-v0.1.0-source.zip
            youtube-easy/youtube-easy-v0.1.0.mcpb.sha256
          )
          gh release create "$tag" --verify-tag --title "YouTube Easy v0.1.0" --notes-file "$RUNNER_TEMP/youtube-easy-notes.md" "${assets[@]}"
