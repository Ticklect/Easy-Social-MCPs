name: Build TikTok Easy v0.1.4

on:
  push:
    branches: [main]
    paths:
      - "tiktok-easy/README.md"
      - "tiktok-easy/SECURITY.md"
      - "tiktok-easy/LICENSE"
      - "tiktok-easy/THIRD_PARTY_LICENSES.md"
      - "tiktok-easy/manifest.json"
      - "tiktok-easy/patch-upstream.mjs"
      - "tiktok-easy/scripts/**"
      - "tiktok-easy/test/**"
      - ".github/workflows/build-tiktok-easy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild pinned TikTok v0.1.4 runtime and artifacts
        run: node tiktok-easy/scripts/build-v0.1.4.mjs

      - name: Verify packaged TikTok runtime
        run: |
          set -euo pipefail
          mkdir -p /tmp/tiktok-easy-smoke
          unzip -q tiktok-easy/tiktok-easy-v0.1.4.mcpb -d /tmp/tiktok-easy-smoke
          node --check /tmp/tiktok-easy-smoke/app/dist/index.js
          node --check /tmp/tiktok-easy-smoke/app/dist/server.js

      - name: Verify TikTok hardening and rate-limit coordination
        run: npm --prefix tiktok-easy test

      - name: Smoke test MCP tools
        run: |
          set -euo pipefail
          cd /tmp/tiktok-easy-smoke
          {
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          } | timeout 10s node app/dist/index.js > /tmp/tiktok-easy-smoke.out || true
          grep -q '"tiktok_login"' /tmp/tiktok-easy-smoke.out
          grep -q '"tiktok_post"' /tmp/tiktok-easy-smoke.out

      - name: Guard immutable release
        id: release_guard
        run: |
          set -euo pipefail
          tag="tiktok-easy-v0.1.4"
          if gh release view "$tag" >/dev/null 2>&1; then
            existing_dir="/tmp/tiktok-easy-existing-release"
            rm -rf "$existing_dir"
            mkdir -p "$existing_dir"
            gh release download "$tag" --dir "$existing_dir" \
              --pattern "tiktok-easy-v0.1.4.mcpb" \
              --pattern "tiktok-easy-v0.1.4-source.zip" \
              --pattern "tiktok-easy-v0.1.4.mcpb.sha256"
            for asset in tiktok-easy-v0.1.4.mcpb tiktok-easy-v0.1.4-source.zip tiktok-easy-v0.1.4.mcpb.sha256; do
              expected="$(sha256sum "tiktok-easy/$asset" | awk '{print $1}')"
              printf '%s  %s\n' "$expected" "$asset" > "$existing_dir/$asset.expected.sha256"
              (cd "$existing_dir" && sha256sum --check "$asset.expected.sha256")
            done
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Existing $tag assets match this build; leaving the release unchanged."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit artifacts
        if: steps.release_guard.outputs.exists != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiktok-easy/tiktok-easy-v0.1.4.mcpb tiktok-easy/tiktok-easy-v0.1.4-source.zip tiktok-easy/tiktok-easy-v0.1.4.mcpb.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Publish TikTok Easy v0.1.4 artifacts"
            git push origin HEAD:main
          fi

      - name: Publish release
        if: steps.release_guard.outputs.exists != 'true'
        run: |
          set -euo pipefail
          tag="tiktok-easy-v0.1.4"
          target="$(git rev-parse HEAD)"
          cat > /tmp/tiktok-easy-notes.md <<'EOF'
          TikTok Easy v0.1.4 packages the MIT-licensed 0xArtex/tiktok-mcp browser-session runtime into a ready-to-import MCPB.

          Import → run tiktok_login → scan the TikTok QR → done.

          No TikTok developer app, API key, client secret, or copied login cookies are required. Existing-browser attachment needs an active local CDP endpoint; ordinary browser windows do not expose one.

          This is an unofficial browser-session integration, not the official TikTok API. Browser automation carries platform/account risk and may break when TikTok changes its web interface.
          EOF
          gh release create "$tag" --target "$target" --title "TikTok Easy v0.1.4" --notes-file /tmp/tiktok-easy-notes.md tiktok-easy/tiktok-easy-v0.1.4.mcpb tiktok-easy/tiktok-easy-v0.1.4-source.zip tiktok-easy/tiktok-easy-v0.1.4.mcpb.sha256
