name: Build TikTok Easy v0.1.0

on:
  push:
    branches: [main]
    paths:
      - "tiktok-easy/**"
      - ".github/workflows/build-tiktok-easy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_SHA: 99ef0359a55ff64b7d4a913369cca5c7bfd2683b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch and patch pinned upstream
        run: |
          set -euo pipefail
          rm -rf /tmp/tiktok-upstream
          git clone --quiet https://github.com/0xArtex/tiktok-mcp.git /tmp/tiktok-upstream
          cd /tmp/tiktok-upstream
          git checkout --quiet "$UPSTREAM_SHA"
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"
          cp "$GITHUB_WORKSPACE/tiktok-easy/patch-upstream.mjs" ./patch-upstream.mjs
          node patch-upstream.mjs

      - name: Build and test runtime
        run: |
          set -euo pipefail
          cd /tmp/tiktok-upstream
          npm ci
          npm test
          npm run build
          npm prune --omit=dev

      - name: Package MCPB
        run: |
          set -euo pipefail
          rm -rf /tmp/tiktok-easy-pkg /tmp/tiktok-easy-smoke
          mkdir -p /tmp/tiktok-easy-pkg/app /tmp/tiktok-easy-smoke
          cp -R /tmp/tiktok-upstream/dist /tmp/tiktok-easy-pkg/app/
          cp -R /tmp/tiktok-upstream/node_modules /tmp/tiktok-easy-pkg/app/
          cp /tmp/tiktok-upstream/package.json /tmp/tiktok-easy-pkg/app/
          cp tiktok-easy/manifest.json /tmp/tiktok-easy-pkg/
          cp tiktok-easy/README.md /tmp/tiktok-easy-pkg/
          cp tiktok-easy/SECURITY.md /tmp/tiktok-easy-pkg/
          cp tiktok-easy/LICENSE /tmp/tiktok-easy-pkg/
          cp tiktok-easy/THIRD_PARTY_LICENSES.md /tmp/tiktok-easy-pkg/

          cd /tmp/tiktok-easy-pkg
          zip -X -q -r "$GITHUB_WORKSPACE/tiktok-easy/tiktok-easy-v0.1.0.mcpb" .

          cd /tmp/tiktok-upstream
          zip -X -q -r "$GITHUB_WORKSPACE/tiktok-easy/tiktok-easy-v0.1.0-source.zip" src package.json package-lock.json tsconfig.json README.md LICENSE SKILL.md server.json

          cd "$GITHUB_WORKSPACE/tiktok-easy"
          sha256sum tiktok-easy-v0.1.0.mcpb > tiktok-easy-v0.1.0.mcpb.sha256

          unzip -q tiktok-easy-v0.1.0.mcpb -d /tmp/tiktok-easy-smoke
          node --check /tmp/tiktok-easy-smoke/app/dist/index.js
          node --check /tmp/tiktok-easy-smoke/app/dist/server.js

      - name: Smoke test MCP tools
        run: |
          set -euo pipefail
          cd /tmp/tiktok-easy-smoke
          {
            echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}'
            echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            echo '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          } | timeout 10s node app/dist/index.js > /tmp/tiktok-easy-smoke.out || true
          grep -q '"tiktok_login"' /tmp/tiktok-easy-smoke.out
          grep -q '"tiktok_post"' /tmp/tiktok-easy-smoke.out

      - name: Commit artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiktok-easy/tiktok-easy-v0.1.0.mcpb tiktok-easy/tiktok-easy-v0.1.0-source.zip tiktok-easy/tiktok-easy-v0.1.0.mcpb.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Publish TikTok Easy v0.1.0 artifacts"
            git push origin HEAD:main
          fi

      - name: Publish release
        run: |
          set -euo pipefail
          tag="tiktok-easy-v0.1.0"
          target="$(git rev-parse HEAD)"
          printf '%s\n'             'TikTok Easy v0.1.0 packages the MIT-licensed 0xArtex/tiktok-mcp browser-session runtime into a ready-to-import MCPB.'             ''             'Import → run tiktok_login → scan the TikTok QR → done.'             ''             'No TikTok developer app, API key, client secret, npm install, TypeScript build, or manual MCP configuration is required.'             ''             'This is an unofficial browser-session integration, not TikTok'''s official API. Browser automation carries platform/account risk and may break when TikTok changes its web interface.'             > /tmp/tiktok-easy-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" tiktok-easy/tiktok-easy-v0.1.0.mcpb tiktok-easy/tiktok-easy-v0.1.0-source.zip tiktok-easy/tiktok-easy-v0.1.0.mcpb.sha256 --clobber
          else
            gh release create "$tag" --target "$target" --title "TikTok Easy v0.1.0" --notes-file /tmp/tiktok-easy-notes.md tiktok-easy/tiktok-easy-v0.1.0.mcpb tiktok-easy/tiktok-easy-v0.1.0-source.zip tiktok-easy/tiktok-easy-v0.1.0.mcpb.sha256
          fi
