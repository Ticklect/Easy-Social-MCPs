name: Build Easy MCP Installer

on:
  push:
    branches: [main]
    tags: ["easy-mcp-installer-v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix easy-mcp-installer run check
      - run: npm --prefix easy-mcp-installer test

  release:
    if: startsWith(github.ref, 'refs/tags/easy-mcp-installer-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix easy-mcp-installer run build
      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to overwrite it."
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            easy-mcp-installer/easy-mcp-installer-v0.1.0.zip \
            easy-mcp-installer/easy-mcp-installer-v0.1.0.zip.sha256 \
            easy-mcp-installer/install-easy-mcp.mjs \
            --verify-tag \
            --title "Easy MCP Installer v0.1.0" \
            --notes "Dependency-free user-scope installer for Reddit Easy, YouTube Easy, X Easy, and TikTok Easy in Codex and Claude Code."
